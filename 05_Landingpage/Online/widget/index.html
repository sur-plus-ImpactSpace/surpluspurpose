<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>sur.plus Bedarfs-Widget</title>
<style>
:root{--brand:#1A5C4A;--brand-lt:#4DB896;--accent:#E8935A;--text:#1c2a26;--text-lt:#5c6f69;--border:#e3e9e6;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font:14px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);padding:2px}
.card{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 16px;max-width:420px;box-shadow:0 1px 4px rgba(26,92,74,.06)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(232,147,90,.35)}50%{box-shadow:0 0 0 6px rgba(232,147,90,0)}}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:14.5px;font-weight:600}
.tx small{color:var(--text-lt);font-size:12px}
a.go{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:10px}
a.go:hover{background:#14493b}
.logo{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--brand);text-decoration:none}
.logo .d{color:var(--accent)}
</style>
</head>
<body>
<div class="card" role="complementary" aria-label="Sachspenden-Bedarf">
  <span class="dot" aria-hidden="true"></span>
  <div class="tx">
    <b id="w-need">Wir suchen Sachspenden</b>
    <small><span id="w-org"></span><span id="w-sep"> &middot; </span>vermittelt über <a class="logo" id="w-brand" href="https://surpluspurpose.com/de/fuer-ngos/?utm_source=widget" target="_blank" rel="noopener">sur<span class="d">.</span>plus</a></small>
  </div>
  <a class="go" id="w-cta" href="https://surpluspurpose.com/de/fuer-unternehmen/?utm_source=widget" target="_blank" rel="noopener">Haben Sie das übrig?</a>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var t=(q.get('text')||'').slice(0,90), o=(q.get('org')||'').slice(0,60), lang=(q.get('lang')==='en')?'en':'de';
  var need=document.getElementById('w-need'), org=document.getElementById('w-org'),
      sep=document.getElementById('w-sep'), cta=document.getElementById('w-cta'), brand=document.getElementById('w-brand');
  if(t){need.textContent=(lang==='en'?'We are looking for: ':'Wir suchen: ')+t;}
  else{need.textContent=(lang==='en'?'We are looking for in-kind donations':'Wir suchen Sachspenden');}
  if(o){org.textContent=o;}else{sep.style.display='none';}
  if(lang==='en'){
    cta.textContent='Can you spare this?';
    cta.href='https://surpluspurpose.com/for-companies/?utm_source=widget';
    brand.href='https://surpluspurpose.com/for-ngos/?utm_source=widget';
    document.documentElement.lang='en';
  }
})();
</script>
</body>
</html>
