packages:
  - "apps/*"
  - "packages/*"
  - "tools"

onlyBuiltDependencies:
  - sharp
allowBuilds:
  sharp: true

# SheetJS (xlsx) is pinned to the npm-published 0.18.5; the patched >=0.20.2 is
# only on the SheetJS CDN, which our CI/tooling can't resolve reproducibly.
# These two advisories are accepted with low real-world risk: xlsx parsing runs
# only client-side, in the uploader's own browser, on the uploader's own file
# (no server-side or third-party exposure). Revisit when a2/XLSX gets real focus.
auditConfig:
  ignoreGhsas:
    - GHSA-4r6h-8v6p-xvw6
    - GHSA-5pgg-2g8v-p4x9
    # braces 3.0.4 is not published to npm yet; dev tooling only (tailwind build), not shipped.
    - GHSA-vfj7-8cjw-p6xm
    # vite dev-server only (Windows launch-editor check); not shipped to users.
    - GHSA-587h-7wmj-h5pm
    # picomatch ReDoS (GHSA-fc5q-39xc-vjpf): advisory claims >=4.0.8 but that version
    # is not on npm yet (latest is 4.0.7). Transitive via eslint/vitest/vite/shadcn
    # tooling only — not shipped user-facing. Revisit when 4.0.8+ publishes.
    - GHSA-fc5q-39xc-vjpf

# Transitive dev-tooling advisories (eslint, vitest, tailwind): pinned to the
# first patched version. Not shipped to the browser or server.
overrides:
  brace-expansion: ">=5.0.11"
  nanoid: ">=3.3.18"
  source-map-js: ">=1.2.2"
